services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: "3000"
      DATABASE_URL: postgres://studio:studio@postgres:5432/studio
      STORAGE_DIR: /data/storage
      MAX_PHOTO_BYTES: "8388608"
      TEXT_PROVIDER: ${TEXT_PROVIDER:-openai}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_TEXT_MODEL: ${ANTHROPIC_TEXT_MODEL:-claude-opus-5}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_LOOKBACK_DAYS: ${NEWS_LOOKBACK_DAYS:-21}
      REDIS_URL: redis://redis:6379
      DISCOVERY_SOURCES: ${DISCOVERY_SOURCES:-remotive,himalayas,remoteok,arbeitnow,weworkremotely}
      MATCH_TARGET_USD_MONTHLY: ${MATCH_TARGET_USD_MONTHLY:-6000}
      MATCH_TARGET_ROLES: ${MATCH_TARGET_ROLES:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      WEB_SEARCH_TITLES: ${WEB_SEARCH_TITLES:-senior software engineer,senior fullstack engineer,tech lead,forward deployed engineer,ai engineer}
      EXPLANATION_MIN_SCORE: ${EXPLANATION_MIN_SCORE:-60}
      EXPLANATION_DAILY_LIMIT: ${EXPLANATION_DAILY_LIMIT:-25}
      FOLLOW_UP_AFTER_DAYS: ${FOLLOW_UP_AFTER_DAYS:-10}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      APP_ORIGINS: ${APP_ORIGINS:-}
      APPLICATION_SUBMISSION_ENABLED: ${APPLICATION_SUBMISSION_ENABLED:-false}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_DIR: /data/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      SCREENSHOT_RETENTION_DAYS: ${SCREENSHOT_RETENTION_DAYS:-30}
      MESSAGE_BODY_RETENTION_DAYS: ${MESSAGE_BODY_RETENTION_DAYS:-180}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
    volumes:
      - media_data:/data/storage
      - ./backups:/data/backups
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npx", "tsx", "src/worker.ts"]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://studio:studio@postgres:5432/studio
      REDIS_URL: redis://redis:6379
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-300000}
      DISCOVERY_SOURCES: ${DISCOVERY_SOURCES:-remotive,himalayas,remoteok,arbeitnow,weworkremotely}
      MATCH_TARGET_USD_MONTHLY: ${MATCH_TARGET_USD_MONTHLY:-6000}
      MATCH_TARGET_ROLES: ${MATCH_TARGET_ROLES:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      WEB_SEARCH_TITLES: ${WEB_SEARCH_TITLES:-senior software engineer,senior fullstack engineer,tech lead,forward deployed engineer,ai engineer}
      EXPLANATION_MIN_SCORE: ${EXPLANATION_MIN_SCORE:-60}
      EXPLANATION_DAILY_LIMIT: ${EXPLANATION_DAILY_LIMIT:-25}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      NOTIFY_DIGEST_MIN_SCORE: ${NOTIFY_DIGEST_MIN_SCORE:-80}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      DISCOVERY_KEYWORDS: ${DISCOVERY_KEYWORDS:-typescript,node.js,angular,tech lead,forward deployed engineer,ai engineer}
      DISCOVERY_CRON: ${DISCOVERY_CRON:-0 9 * * *}
      DISCOVERY_TZ: ${DISCOVERY_TZ:-America/Sao_Paulo}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      TEXT_PROVIDER: ${TEXT_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_TEXT_MODEL: ${ANTHROPIC_TEXT_MODEL:-claude-opus-5}
      # The daily encrypted backup (Milestone 6) of the database and the stored files, at 03:00.
      STORAGE_DIR: /data/storage
      BACKUP_DIR: /data/backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      SCREENSHOT_RETENTION_DAYS: ${SCREENSHOT_RETENTION_DAYS:-30}
      MESSAGE_BODY_RETENTION_DAYS: ${MESSAGE_BODY_RETENTION_DAYS:-180}
    volumes:
      - media_data:/data/storage
      - ./backups:/data/backups
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src

  # Runs Chromium for application preparation (Milestone 3). It gets the database, Redis and the
  # storage volume (to attach the CV and save preview screenshots): no model keys, no API port,
  # and resource limits. Chromium itself only receives the files the worker hands it.
  browser-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.browser
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://studio:studio@postgres:5432/studio
      REDIS_URL: redis://redis:6379
      BROWSER_EXECUTABLE_PATH: ${BROWSER_EXECUTABLE_PATH:-}
      BROWSER_RUN_TIMEOUT_MS: ${BROWSER_RUN_TIMEOUT_MS:-120000}
      APPLICATION_SUBMISSION_ENABLED: ${APPLICATION_SUBMISSION_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      STORAGE_DIR: /data/storage
    shm_size: "1gb"
    mem_limit: 2g
    cpus: 1.5
    volumes:
      - media_data:/data/storage
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:3000
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages/shared/src:/app/packages/shared/src
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  media_data:
  redis_data:
