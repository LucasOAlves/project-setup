services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: "3000"
      DATABASE_URL: postgres://studio:studio@postgres:5432/studio
      STORAGE_DIR: /data/storage
      MAX_PHOTO_BYTES: "8388608"
      TEXT_PROVIDER: ${TEXT_PROVIDER:-openai}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_TEXT_MODEL: ${ANTHROPIC_TEXT_MODEL:-claude-opus-5}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_LOOKBACK_DAYS: ${NEWS_LOOKBACK_DAYS:-21}
      REDIS_URL: redis://redis:6379
      DISCOVERY_SOURCES: ${DISCOVERY_SOURCES:-remotive,himalayas,remoteok,arbeitnow,weworkremotely}
      MATCH_TARGET_USD_MONTHLY: ${MATCH_TARGET_USD_MONTHLY:-6000}
      MATCH_TARGET_ROLES: ${MATCH_TARGET_ROLES:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      WEB_SEARCH_TITLES: ${WEB_SEARCH_TITLES:-senior software engineer,senior fullstack engineer,tech lead,forward deployed engineer,ai engineer}
      EXPLANATION_MIN_SCORE: ${EXPLANATION_MIN_SCORE:-60}
      EXPLANATION_DAILY_LIMIT: ${EXPLANATION_DAILY_LIMIT:-25}
    volumes:
      - media_data:/data/storage
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npx", "tsx", "src/worker.ts"]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://studio:studio@postgres:5432/studio
      REDIS_URL: redis://redis:6379
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-300000}
      DISCOVERY_SOURCES: ${DISCOVERY_SOURCES:-remotive,himalayas,remoteok,arbeitnow,weworkremotely}
      MATCH_TARGET_USD_MONTHLY: ${MATCH_TARGET_USD_MONTHLY:-6000}
      MATCH_TARGET_ROLES: ${MATCH_TARGET_ROLES:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      WEB_SEARCH_TITLES: ${WEB_SEARCH_TITLES:-senior software engineer,senior fullstack engineer,tech lead,forward deployed engineer,ai engineer}
      EXPLANATION_MIN_SCORE: ${EXPLANATION_MIN_SCORE:-60}
      EXPLANATION_DAILY_LIMIT: ${EXPLANATION_DAILY_LIMIT:-25}
      DISCOVERY_KEYWORDS: ${DISCOVERY_KEYWORDS:-typescript,node.js,angular,tech lead,forward deployed engineer,ai engineer}
      DISCOVERY_CRON: ${DISCOVERY_CRON:-0 9 * * *}
      DISCOVERY_TZ: ${DISCOVERY_TZ:-America/Sao_Paulo}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      TEXT_PROVIDER: ${TEXT_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_TEXT_MODEL: ${ANTHROPIC_TEXT_MODEL:-claude-opus-5}
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:3000
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages/shared/src:/app/packages/shared/src
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  media_data:
  redis_data:
